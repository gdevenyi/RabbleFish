[project]
name = "ltt"
version = "0.1.0"
description = "Live transcription and translation of PipeWire sources: backend"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.15"  # lingua-language-detector 2.2.0 has wheels for 3.12-3.14 only
dependencies = [
    "fastapi>=0.162.0",
    "lingua-language-detector>=2.2.0",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.3",
]

[project.scripts]
ltt = "ltt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ltt"]

# Builds the UI and adds it to the wheel as ltt/static (see hatch_build.py).
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "jsonschema>=4.26.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
